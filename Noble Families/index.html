<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山河帝脉 · 全球帝王贵族时间线地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0a07;
      --panel: rgba(24, 18, 10, 0.86);
      --line: rgba(214, 176, 96, 0.38);
      --gold: #e6c56a;
      --gold-2: #f6e3b0;
      --ink: #f6ead0;
      --muted: #b09a74;
      --chip: rgba(230, 197, 106, 0.1);
      --cyan: #ffe566;
      --violet: #d7b15a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: "Noto Serif SC", "Noto Sans SC", serif; overflow: hidden; }
    #map, #globe { position: absolute; inset: 0; background: #0c0a07; }
    #globe canvas { filter: sepia(.78) saturate(.9) hue-rotate(-6deg) contrast(1.08) brightness(.9); }
    #globe { z-index: 2; }
    #map { z-index: 1; }
    .hidden { visibility: hidden !important; pointer-events: none !important; }
    .leaflet-container { background: #050314; font-family: inherit; }
    .leaflet-control-attribution { background: rgba(0,0,0,.35) !important; color: #7a7468 !important; }
    .leaflet-control-attribution a { color: #9a917f !important; }
    .leaflet-control-zoom { border: 1px solid var(--line) !important; }
    .leaflet-control-zoom a { background: rgba(12,14,20,.88) !important; color: var(--gold) !important; border-bottom-color: var(--line) !important; }

    .vignette {
      pointer-events: none;
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 52%, rgba(18, 12, 4, .62) 100%),
        linear-gradient(180deg, rgba(28, 18, 8, .38) 0%, transparent 16%, transparent 74%, rgba(12, 8, 4, .72) 100%);
      z-index: 3;
    }
    .atlas {
      pointer-events: none;
      position: absolute; inset: 0; z-index: 3;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='none' stroke='%23e6c56a' stroke-width='.55' opacity='.32'><circle cx='120' cy='120' r='90'/><circle cx='120' cy='120' r='60'/><circle cx='120' cy='120' r='30'/><path d='M120 20 V220 M20 120 H220'/><path d='M120 120 L186 54 M120 120 L186 186 M120 120 L54 54 M120 120 L54 186'/></g></svg>"),
        radial-gradient(circle at 12% 18%, rgba(230,197,106,.1), transparent 28%),
        radial-gradient(circle at 88% 80%, rgba(180,120,40,.1), transparent 32%);
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-position: left 18px bottom 120px, 0 0, 0 0;
      background-size: 180px 180px, 100% 100%, 100% 100%;
      mix-blend-mode: screen;
      opacity: .9;
    }
    .atlas::before {
      content: "";
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.2  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      opacity: .18;
      mix-blend-mode: overlay;
    }

    .top-bar {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 500; text-align: center; pointer-events: none;
      width: min(94vw, 760px);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(8,9,14,.72);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      padding: 8px 16px; border-radius: 999px;
      pointer-events: auto;
    }
    .badge .seal {
      width: 18px; height: 18px; border: 1.5px solid var(--gold);
      border-radius: 3px; display: grid; place-items: center;
      font-family: "Noto Serif SC", serif; font-size: 11px; color: var(--gold);
    }
    .title { font-family: "Noto Serif SC", serif; font-weight: 900; letter-spacing: .18em; font-size: 15px; }
    .langs { display: flex; gap: 4px; margin-left: 10px; }
    .langs button {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 2px 8px; font-size: 11px; letter-spacing: .08em; cursor: pointer;
    }
    .langs button.active { color: var(--gold-2); border-color: var(--gold); background: rgba(201,163,106,.16); }
    .stats em { font-style: normal; color: var(--muted); }
    .sub { margin-top: 8px; color: var(--muted); font-size: 12px; letter-spacing: .06em; min-height: 18px; }
    .stats { margin-top: 6px; display: flex; justify-content: center; gap: 14px; font-size: 12px; color: var(--gold-2); }
    .views {
      margin-top: 10px; display: inline-flex; gap: 6px; pointer-events: auto;
      background: rgba(8,9,14,.66); border: 1px solid var(--line); border-radius: 999px; padding: 4px;
    }
    .view-btn {
      border: 0; background: transparent; color: var(--muted);
      font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .view-btn.active { background: rgba(232,196,120,.16); color: var(--gold-2); }

    .year-hud {
      position: absolute; top: 14px; right: 14px; z-index: 500;
      background: rgba(8,9,14,.72); border: 1px solid var(--line);
      backdrop-filter: blur(12px); border-radius: 16px; padding: 12px 16px;
      min-width: 150px; text-align: right;
    }
    .year-hud .era { font-size: 11px; color: var(--muted); letter-spacing: .16em; }
    .year-hud .num { font-family: "Noto Serif SC", serif; font-size: 26px; line-height: 1.1; color: var(--gold); transition: color .2s ease, text-shadow .2s ease; }
    .year-hud .num.tick { text-shadow: 0 0 16px rgba(94,231,255,.65); }

    .legend, .search {
      position: absolute; left: 14px; z-index: 500;
      background: rgba(8,9,14,.72); border: 1px solid var(--line);
      backdrop-filter: blur(12px); border-radius: 16px;
    }
    .legend { top: 14px; padding: 12px 14px; font-size: 12px; width: 168px; }
    .legend h4 { font-weight: 500; color: var(--muted); margin-bottom: 8px; letter-spacing: .12em; font-size: 11px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .search { top: 210px; width: 168px; padding: 0; background: transparent; border: 0; }
    .search input {
      width: 100%; background: rgba(8,9,14,.72); border: 1px solid var(--line);
      color: var(--ink); border-radius: 12px; padding: 8px 10px; font-size: 12px;
    }

    .bottom {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      z-index: 500; width: min(96vw, 980px);
      background: rgba(8,9,14,.78); border: 1px solid var(--line);
      backdrop-filter: blur(16px); border-radius: 22px; padding: 12px 16px 14px;
    }
    .stories { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
    .story-btn, .chip {
      border: 1px solid rgba(120,150,255,.28);
      background: var(--chip); color: var(--ink);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
      transition: transform .16s ease, background .2s ease, border-color .2s ease, color .2s ease;
    }
    .story-btn:hover, .chip:hover { transform: translateY(-1px); }
    .story-btn:active, .chip:active, .rel:active, .tcard:active { transform: scale(.96); }
    .story-btn.active, .chip.active { background: rgba(90,130,255,.2); border-color: var(--gold); color: var(--gold-2); }
    .chip.tapped, .story-btn.tapped, .rel.tapped { animation: tapflash .35s ease; }
    @keyframes tapflash {
      0% { box-shadow: 0 0 0 0 rgba(94,231,255,.45); }
      100% { box-shadow: 0 0 0 12px rgba(94,231,255,0); }
    }
    .story-btn.ghost { opacity: .7; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
    .timeline { display: grid; grid-template-columns: 72px 1fr 72px; align-items: center; gap: 10px; }
    .timeline button {
      background: transparent; border: 1px solid var(--line); color: var(--gold);
      border-radius: 10px; height: 32px; cursor: pointer; font-size: 12px;
    }
    input[type=range] { width: 100%; accent-color: var(--gold); cursor: pointer; }
    #story-card {
      animation: fadeUp .3s ease;
    }
    .ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

    #story-card {
      margin-bottom: 8px; padding: 8px 10px; border: 1px solid rgba(232,196,120,.18);
      border-radius: 12px; font-size: 12px; line-height: 1.65; color: #f0e0b4;
    }
    #story-card h3 { font-family: "Noto Serif SC", serif; color: var(--gold-2); font-size: 15px; margin: 2px 0 4px; }
    #story-card .kicker { color: var(--gold); letter-spacing: .16em; font-size: 10px; }

    .popup {
      position: absolute; right: 16px; top: 96px; bottom: 168px;
      width: min(92vw, 380px); z-index: 520;
      background: rgba(18, 14, 8, .94); border: 1px solid var(--line);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
      border-radius: 20px;
      padding: 18px 16px 16px; overflow: auto;
      opacity: 0; pointer-events: none; transform: translateX(18px) scale(.97);
      transition: opacity .22s ease, transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .popup.open {
      opacity: 1; pointer-events: auto; transform: none;
    }
    .popup .close {
      position: absolute; top: 12px; right: 12px; border: 0; background: transparent;
      color: var(--muted); font-size: 20px; cursor: pointer;
    }
    .popup .kicker, .tree-head .kicker { color: var(--gold); font-size: 11px; letter-spacing: .2em; }
    .popup h2, .tree-head h2 { font-family: "Noto Serif SC", serif; font-size: 24px; margin: 6px 0 4px; }
    .tree-block { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
    .tree-label { font-size: 11px; letter-spacing: .16em; color: #b7c98a; margin-bottom: 8px; }
    .meta { color: #c9b27a; font-size: 13px; margin-bottom: 12px; }
    .blurb { font-size: 14px; line-height: 1.75; color: #f3e2b4; }
    .people { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; border: 1px solid rgba(230,197,106,.4); border-radius: 999px;
      padding: 3px 10px 3px 3px; color: #f6e3b0;
      background: transparent; appearance: none; -webkit-appearance: none;
      animation: fadeUp .35s ease both;
    }
    .tag img, .tag .pavatar { width: 22px; height: 22px; }
    .tag:nth-child(1) { animation-delay: .02s; }
    .tag:nth-child(2) { animation-delay: .06s; }
    .tag:nth-child(3) { animation-delay: .10s; }
    .tag:nth-child(4) { animation-delay: .14s; }
    .tag:nth-child(5) { animation-delay: .18s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .relations { margin-top: 16px; }
    .relations h3 { font-size: 12px; color: var(--muted); letter-spacing: .14em; margin-bottom: 8px; }
    .rel {
      display: block; width: 100%; text-align: left; background: transparent;
      border: 1px solid rgba(230,197,106,.28); color: #f0e0b4; padding: 8px 10px; border-radius: 10px;
      margin-bottom: 6px; cursor: pointer; font-size: 13px;
      transition: transform .16s ease, border-color .2s ease;
    }
    .rel strong { color: #ffe98a; }
    .rel em { display: block; font-style: normal; font-size: 11px; color: #b7c98a; margin: 3px 0; }
    .rel span { display: block; font-size: 12px; line-height: 1.55; color: #ead6ae; }
    .rk {
      display: inline-block; font-style: normal; font-size: 10px; letter-spacing: .12em;
      border: 1px solid rgba(183,201,138,.45); border-radius: 999px;
      padding: 1px 7px; margin: 0 6px 4px 0; color: #b7c98a;
    }
    .rk-marry, .rk-heir, .rk-war, .rk-fief, .rk-ally, .rk-link { border-color: #b7c98a; color: #c9d7a4; }
    .rel:hover { background: rgba(230,197,106,.1); }

    .marker-wrap { background: transparent; border: 0; }
    .pin {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(190, 220, 255, .85);
      box-shadow: 0 0 16px currentColor, 0 0 28px currentColor, 0 0 2px #000;
      transform: translate(-7px, -7px);
    }
    .pin.pulse::after {
      content: ""; position: absolute; inset: -6px; border-radius: 50%;
      border: 1px solid currentColor; opacity: .45;
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      from { transform: scale(.6); opacity: .55; }
      to { transform: scale(2.1); opacity: 0; }
    }
    .arc-label { background: transparent; border: 0; }
    .arc-label span {
      display: inline-block; font-size: 10px; color: var(--gold-2);
      background: rgba(8,9,14,.75); padding: 2px 6px; border-radius: 8px;
      transform: translate(-50%, -50%); white-space: nowrap;
    }

    .gpin {
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,.55));
    }
    .gpin.off { opacity: 0.55; }
    .gpin.off .gchip em { display: none; }
    .gpin { transition: opacity .25s ease; }
    .gchip {
      position: relative;
      min-width: 92px; max-width: 168px;
      padding: 0 8px 78px;
      color: #f3e2b4;
      background: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      display: block;
      text-align: center;
    }
    .gchip::before, .gchip::after { display: block; }
    .gchip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 132px;
      height: 72px;
      opacity: .62;
      mix-blend-mode: screen;
      filter: brightness(1.2) contrast(1.12);
      transform: translateX(-50%);
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;
      pointer-events: none;
    }
    .gchip.r-东亚::after { background-image: url("ui/east.png"); }
    .gchip.r-欧洲::after { background-image: url("ui/europe.png"); }
    .gchip.r-中东::after { background-image: url("ui/mideast.png"); }
    .gchip.r-南亚::after { background-image: url("ui/south.png"); }
    .gchip.r-非洲::after { background-image: url("ui/africa.png"); }
    .gchip.r-美洲::after { background-image: url("ui/america.png"); }
    .gchip .gavatar, .gchip.has-photo .gavatar { display: none !important; }
    .gchip.has-photo { display: block; text-align: center; }
    .gchip.has-photo .gavatar { display: inline-block; margin: 0 auto 4px; }

    .gavatar, .pavatar, .tag img {
      width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
      background: transparent;
      border: 1px solid rgba(190,220,255,.5);
    }
    .gavatar[hidden], .pavatar[hidden], .tag img[hidden] { display: none !important; }
    .tag.now { border-color: #ffe566; color: #ffe98a; }
    button.tag { font: inherit; background: transparent; color: inherit; box-shadow: none; }
    .person-card {
      margin-top: 12px; padding: 10px 12px;
      border: 1px solid rgba(230,197,106,.28);
      background: rgba(28, 22, 10, .45);
      border-radius: 14px;
      animation: fadeUp .28s ease;
    }
    .person-card .pkicker { font-size: 10px; letter-spacing: .16em; color: #b7c98a; }
    .person-card .phead { display: flex; gap: 10px; align-items: center; margin: 6px 0 8px; }
    .person-card .pbig {
      width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(230,197,106,.4);
    }
    .person-card h3 { font-family: "Noto Serif SC", serif; font-size: 18px; margin: 0; color: #ffe98a; }
    .person-card .pmeta { font-size: 11px; color: #c9b27a; margin-top: 2px; }
    .person-card p { font-size: 13px; line-height: 1.7; color: #f3e2b4; margin: 0 0 8px; }
    .person-card p b { color: #ffe98a; font-weight: 600; margin-right: 6px; }
    .prels { margin: 8px 0 0; }
    .prel { font-size: 12px; line-height: 1.55; color: #ead6ae; margin-top: 6px; }
    .prel small { display: block; color: #b7c98a; margin-top: 2px; }
    #d-house-wiki { font-size: 13px; line-height: 1.75; color: #f0e0b4; }
    .blurb p { margin: 0 0 8px; font-size: 13px; line-height: 1.75; color: #f3e2b4; }
    .gfaces { display: flex; margin-top: 3px; }
    .gfaces img {
      width: 18px; height: 18px; border-radius: 50%; object-fit: cover;
      margin-left: -6px; border: 1px solid rgba(8,10,28,.9);
    }
    .gfaces img:first-child { margin-left: 0; }
    .gchip b {
      display: block; font-family: "Noto Serif SC", serif;
      font-size: 12px; line-height: 1.25; color: #f6e3b0;
      text-shadow: 0 1px 6px rgba(0,0,0,.85);
    }
    .gchip i, .gchip em {
      display: block; font-style: normal; font-size: 10px;
      color: #e6d4a4; line-height: 1.35;
    }
    .gchip em { color: #e6d7a8; }
    .gpin.selected .gchip {
      background: none;
      filter: none;
      box-shadow: none;
    }
    .gpin.selected .gchip::after {
      opacity: .92;
      filter:
        brightness(1.35)
        contrast(1.08)
        drop-shadow(0 0 1px #ffe566)
        drop-shadow(0 0 6px #ffe566)
        drop-shadow(0 0 16px rgba(255, 229, 102, .9));
    }
    .gpin.selected { z-index: 40; opacity: 1; }
    .gcard {
      width: 230px;
      background: rgba(8,10,16,.94);
      border: 1px solid var(--c);
      border-radius: 14px; padding: 10px 12px 12px;
    }
    .gkicker { font-size: 10px; letter-spacing: .14em; color: var(--c); }
    .gtitle { font-family: "Noto Serif SC", serif; font-size: 18px; margin: 2px 0; }
    .gmeta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .gpeople { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .gpeople span {
      font-size: 11px; border: 1px solid var(--line); border-radius: 999px;
      padding: 2px 6px; color: var(--gold-2);
    }
    .gblurb { font-size: 12px; line-height: 1.6; color: #f3e2b4; }
    .glinks { margin-top: 8px; font-size: 11px; color: var(--muted); }
    .glinks em { font-style: normal; color: var(--c); }

    #tree-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
    .tree { list-style: none; border-left: 1px solid var(--line); margin-left: 8px; }
    .tnode { margin: 8px 0 8px 12px; }
    .tcard {
      width: 100%; text-align: left; background: transparent;
      border: 1px solid rgba(230,197,106,.28); color: #f0e0b4;
      border-radius: 12px; padding: 8px 10px; cursor: pointer;
      transition: transform .16s ease, border-color .2s ease;
    }
    .tcard:hover { background: rgba(230,197,106,.08); }
    .popup h2 { color: #ffe98a; }
    .popup .kicker { color: #b7c98a; }
    .trole { display: block; font-size: 10px; letter-spacing: .14em; color: var(--gold); }
    .tname { font-family: "Noto Serif SC", serif; font-size: 16px; }
    .tyears, .tspouse, .tcount { display: block; font-size: 11px; color: var(--muted); }
    .tnote { font-size: 12px; line-height: 1.6; color: #ead6ae; margin: 6px 0 0 4px; }
    .tkids { display: none; list-style: none; }
    .tnode.open > .tkids { display: block; }
    .tree-empty { color: var(--muted); font-size: 13px; line-height: 1.7; padding: 20px 8px; }

    #map { visibility: hidden !important; pointer-events: none !important; }

    @media (max-width: 720px) {
      .legend, .search, .year-hud { display: none; }
      .popup { top: auto; bottom: 168px; left: 10px; right: 10px; width: auto; max-height: 42vh; }
      .title { letter-spacing: .12em; }
    }
  </style>
</head>
<body data-view="globe">
  <div id="globe"></div>
  <div id="map" class="hidden"></div>
  <div class="vignette"></div>
  <div class="atlas"></div>

  <div class="legend">
    <h4>Regions</h4>
    <div class="legend-row"><span class="dot" style="color:#e6c56a;background:#e6c56a"></span>East Asia</div>
    <div class="legend-row"><span class="dot" style="color:#f0d48a;background:#f0d48a"></span>Europe</div>
    <div class="legend-row"><span class="dot" style="color:#d7b15a;background:#d7b15a"></span>Near East / N. Africa</div>
    <div class="legend-row"><span class="dot" style="color:#ecd9a0;background:#ecd9a0"></span>South / SE Asia</div>
    <div class="legend-row"><span class="dot" style="color:#c9a24a;background:#c9a24a"></span>Africa</div>
    <div class="legend-row"><span class="dot" style="color:#f3e2b4;background:#f3e2b4"></span>Americas</div>
  </div>

  <div class="search">
    <input id="q" placeholder="Search house / capital…" />
  </div>

  <div class="top-bar">
    <div class="badge">
      <span class="seal">Y</span>
      <span class="title">Imperial Bloodlines</span>
      <div class="langs">
        <button type="button" data-lang="zh">中</button>
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </div>
    <div class="sub" id="subline">Every house stays on the globe · lit pins are still ruling this year</div>
    <div class="stats">
      <span><b id="stat-n">0</b> <em id="lbl-pins">pins</em></span>
      <span><b id="stat-alive">0</b> <em id="lbl-alive">ruling now</em></span>
      <span><b id="stat-links">0</b> <em id="lbl-links">arcs</em></span>
    </div>
  </div>

  <div class="year-hud">
    <div class="era" id="era-label">High Middle Ages</div>
    <div class="num" id="year-label">CE 800</div>
  </div>

  <aside class="popup" id="popup">
    <button class="close" id="close">×</button>
    <div class="kicker" id="d-kicker"></div>
    <h2 id="d-title"></h2>
    <div class="meta" id="d-meta"></div>
    <div class="blurb" id="d-blurb"></div>
    <div class="people" id="d-people"></div>
    <div id="d-person" class="person-card" hidden></div>
    <div class="relations" id="d-rel-wrap"></div>
    <div class="tree-block">
      <div class="tree-label">Main line · tap a name</div>
      <div id="tree-pane"></div>
    </div>
  </aside>

  <div class="bottom">
    <div class="stories" id="stories"></div>
    <div id="story-card" hidden></div>
    <div class="chips" id="chips"></div>
    <div class="timeline">
      <button id="play">Play</button>
      <div>
        <input type="range" id="year" min="-2500" max="1918" value="800" />
        <div class="ticks">
          <span>2500 BCE</span><span>1000 BCE</span><span>1 CE</span><span>800</span><span>1453</span><span>1918</span>
        </div>
      </div>
      <button id="now">This year</button>
    </div>
  </div>
